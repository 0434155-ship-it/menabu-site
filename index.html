<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Между Нами Булочками · варианты сайта</title>
<style>
:root{--bg:#fff;--ink:#2a2a24;--mute:#77746b;--line:#e6e3dc;--on:#2a2a24;--onink:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.bar{height:60px;display:flex;align-items:center;gap:24px;padding:0 24px;border-bottom:1px solid var(--line)}
.lbl{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.tabs{flex:1;display:flex;justify-content:center;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font:inherit;font-size:16px;border:0;background:none;color:var(--ink);padding:10px 18px;border-radius:6px;cursor:pointer;white-space:nowrap}
.tabs button:hover{background:#f3f1ec}
.tabs button[aria-pressed=true]{background:var(--on);color:var(--onink)}
.open{font-size:14px;color:var(--ink);white-space:nowrap}
iframe{display:block;width:100%;height:calc(100% - 60px);border:0}
@media (max-width:760px){
 .bar{gap:0;padding:0 8px}.lbl,.open{display:none}
 .tabs{justify-content:flex-start}.tabs button{font-size:14px;padding:9px 12px}
}
</style>
</head>
<body>
<div class="bar">
 <div class="lbl">Варианты сайта</div>
 <nav class="tabs" id="tabs">
  <button data-v="classic">01 · Классика</button>
  <button data-v="anim">02 · Анимированный</button>
  <button data-v="dark">03 · Тёмный</button>
  <button data-v="warm">04 · Тёплый</button>
 </nav>
 <a class="open" id="open" href="classic.html" target="_blank">Открыть отдельно ↗</a>
</div>
<iframe id="f" title="Вариант сайта"></iframe>
<script>
const f=document.getElementById('f'),open=document.getElementById('open'),btns=[...document.querySelectorAll('#tabs button')];
function show(v){
 if(!btns.some(b=>b.dataset.v===v))v='classic';
 btns.forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));
 f.src=v+'.html';open.href=v+'.html';
 if(location.hash!=='#'+v)history.replaceState(null,'','#'+v);
}
btns.forEach(b=>b.onclick=()=>show(b.dataset.v));
show(location.hash.slice(1));
</script>
</body>
</html>
